[package]
name = "pixelanea-shell"
version = "1.6.0"
description = "Pixelanea native desktop shell"
authors = ["Pixelanea contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.78"

[lib]
name = "pixelanea_shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "pixelanea-shell"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2"
ureq = { version = "2.10", default-features = false }
zip = { version = "2.2", default-features = false, features = ["deflate"] }
libc = "0.2"
