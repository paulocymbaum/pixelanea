openapi: 3.1.0
info:
  title: Pixelanea API
  version: 1.6.0
  description: Local-only pixel art editor backend API.

servers:
  - url: http://127.0.0.1:8787
    description: Local development server

paths:
  /api/health:
    get:
      operationId: getHealth
      summary: Health check
      tags: [System]
      responses:
        "200":
          description: Server is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /api/dialog/pick-project-path:
    post:
      operationId: pickProjectPath
      summary: Show native file picker for a .pixelanea bundle path
      tags: [Dialog]
      description: |
        Opens a native file dialog on the host (zenity on Linux desktop builds).

        **Cancel semantics:** HTTP 200 with `{ "cancelled": true }` — not 204.

        **Blocking:** Zenity runs synchronously on the server thread until the user
        selects a file or dismisses the dialog. The server waits up to 300 seconds,
        then returns 504 Gateway Timeout.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PickProjectPathRequest"
      responses:
        "200":
          description: Selected path or user cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PickProjectPathResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "503":
          description: Native file dialog unavailable on this host
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "504":
          description: File dialog timed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/projects:
    post:
      operationId: createProject
      summary: Create a new project
      tags: [Projects]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
      responses:
        "201":
          description: Project created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/projects/open:
    post:
      operationId: openProject
      summary: Open a project from a .pixelanea bundle on disk
      tags: [Projects]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenProjectRequest"
      responses:
        "200":
          description: Project opened from bundle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/projects/{projectId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: getProject
      summary: Get project metadata
      tags: [Projects]
      responses:
        "200":
          description: Project metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateProject
      summary: Update project settings
      tags: [Projects]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectRequest"
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: closeProject
      summary: Close project and release resources
      tags: [Projects]
      responses:
        "204":
          description: Project closed
        "404":
          $ref: "#/components/responses/NotFound"

  /api/projects/{projectId}/save:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      operationId: saveProject
      summary: Save project to a .pixelanea bundle on disk
      tags: [Projects]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveProjectRequest"
      responses:
        "200":
          description: Project saved to bundle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaveProjectResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/projects/{projectId}/palette:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: getPalette
      summary: Get default palette
      tags: [Palettes]
      responses:
        "200":
          description: Default palette
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Palette"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: putPalette
      summary: Replace default palette colors
      tags: [Palettes]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PutPaletteRequest"
      responses:
        "200":
          description: Palette updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Palette"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/projects/{projectId}/frames:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listFrames
      summary: List frame metadata
      tags: [Frames]
      responses:
        "200":
          description: Frame list
          content:
            application/json:
              schema:
                type: object
                required: [frames]
                properties:
                  frames:
                    type: array
                    items:
                      $ref: "#/components/schemas/FrameMetadata"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/projects/{projectId}/frames/duplicate:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      operationId: duplicateFrames
      summary: Duplicate source frame into 8, 16, or 32 frames
      tags: [Frames]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DuplicateFramesRequest"
      responses:
        "200":
          description: Frames duplicated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DuplicateFramesResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/projects/{projectId}/frames/copy:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      operationId: copyFrame
      summary: Copy pixel data from one frame into another
      tags: [Frames]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CopyFrameRequest"
      responses:
        "200":
          description: Target frame updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CopyFrameResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/projects/{projectId}/frames/reorder:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      operationId: reorderFrames
      summary: Move a frame to a new index in the strip
      tags: [Frames]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReorderFramesRequest"
      responses:
        "200":
          description: Frames reordered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReorderFramesResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/projects/{projectId}/import/pixelate:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      operationId: importPixelate
      summary: Decode image, downscale, quantize, and apply to a frame
      tags: [Import]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PixelateImportRequest"
      responses:
        "200":
          description: Pixelated frame applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PixelateImportResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/projects/{projectId}/export/gif:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      operationId: exportGif
      summary: Export all frames as an animated GIF
      tags: [Export]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExportGifRequest"
      responses:
        "200":
          description: Animated GIF bytes
          content:
            image/gif:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/projects/{projectId}/frames/{frameIndex}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/FrameIndex"
    get:
      operationId: getFrame
      summary: Get frame pixel data
      description: |
        Returns frame pixels as JSON by default (`Accept: application/json` or omitted).
        Request `Accept: application/octet-stream` for raw palette-index bytes (row-major,
        `width * height` bytes). Frame dimensions and metadata are returned in response
        headers on the binary lane (see `FrameBinaryResponseHeaders`).
      tags: [Frames]
      parameters:
        - name: Accept
          in: header
          required: false
          description: Prefer `application/octet-stream` for raw bytes; default is JSON.
          schema:
            type: string
            default: application/json
      responses:
        "200":
          description: Frame data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Frame"
            application/octet-stream:
              schema:
                type: string
                format: binary
              description: Raw palette indices row-major (width * height bytes)
          headers:
            X-Frame-Index:
              $ref: "#/components/headers/FrameIndexHeader"
            X-Frame-Width:
              $ref: "#/components/headers/FrameWidthHeader"
            X-Frame-Height:
              $ref: "#/components/headers/FrameHeightHeader"
            X-Frame-Updated-At:
              $ref: "#/components/headers/FrameUpdatedAtHeader"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: putFrame
      summary: Replace frame pixel data
      description: |
        JSON body (`PutFrameRequest`) remains the default and backward-compatible path.
        Send `Content-Type: application/octet-stream` with raw palette-index bytes
        (row-major, `project.width * project.height` bytes) to avoid JSON `number[]`
        expansion. Dimensions are taken from project metadata, not the body.
      tags: [Frames]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PutFrameRequest"
          application/octet-stream:
            schema:
              type: string
              format: binary
            description: Raw palette indices row-major (width * height bytes)
      responses:
        "200":
          description: Frame updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FrameMetadata"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/projects/{projectId}/frames/{frameIndex}/cells:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/FrameIndex"
    patch:
      operationId: patchFrameCells
      summary: Apply cell-level pixel changes
      description: |
        Applies a batch of cell changes without replacing the full grid. Each change
        includes `previous` for optimistic concurrency; mismatches return 409.
        Prefer full `PUT` with `application/octet-stream` for large change sets
        or after undo/redo.
      tags: [Frames]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/CellChange"
      responses:
        "200":
          description: Frame updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FrameMetadata"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Cell conflict (previous value mismatch)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/compute/selection:
    post:
      operationId: computeSelection
      summary: Compute selection extract, clear, paste, or move cell changes
      description: |
        Pure compute endpoint for editor responsiveness. Does not persist changes.
        Mirrors frontend selection mask geometry (rect, square, ellipse).
      tags: [Compute]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SelectionComputeRequest"
      responses:
        "200":
          description: Computed clipboard or cell changes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SelectionComputeResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

components:
  headers:
    FrameIndexHeader:
      description: Frame index in the animation timeline
      schema:
        type: integer
        minimum: 0
    FrameWidthHeader:
      description: Frame width in pixels
      schema:
        type: integer
        minimum: 1
    FrameHeightHeader:
      description: Frame height in pixels
      schema:
        type: integer
        minimum: 1
    FrameUpdatedAtHeader:
      description: ISO-8601 timestamp of the last frame update
      schema:
        type: string
        format: date-time

  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    FrameIndex:
      name: frameIndex
      in: path
      required: true
      schema:
        type: integer
        minimum: 0

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    AssetType:
      type: string
      enum: [character, prop, background, animation]
      default: character
      description: Kind of pixel art asset for export and organization

    HealthResponse:
      type: object
      required: [status, version]
      properties:
        status:
          type: string
          enum: [ok]
        version:
          type: string
          example: "1.0.0"

    PickProjectPathRequest:
      type: object
      required: [mode]
      properties:
        mode:
          type: string
          enum: [open, saveAs]
          description: Whether to pick an existing bundle or a save destination
        defaultPath:
          type: string
          description: Optional directory or file path to pre-select in the dialog
        defaultName:
          type: string
          description: Suggested filename (without extension) for save dialogs

    PickProjectPathResponse:
      type: object
      description: |
        Exactly one of `path` or `cancelled` is set on success responses.
        Cancel uses `{ "cancelled": true }` with HTTP 200.
      properties:
        path:
          type: string
          description: Absolute filesystem path to a .pixelanea bundle
        cancelled:
          type: boolean
          description: True when the user dismissed the dialog without choosing

    ErrorResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string

    CreateProjectRequest:
      type: object
      required: [name, width, height]
      properties:
        name:
          type: string
          minLength: 1
        width:
          type: integer
          minimum: 1
          maximum: 512
        height:
          type: integer
          minimum: 1
          maximum: 512
        frameCount:
          type: integer
          enum: [1, 8, 16, 32]
          default: 1
        fps:
          type: number
          minimum: 1
          maximum: 60
          default: 8
        cellSize:
          type: integer
          minimum: 1
          maximum: 64
          default: 16
        assetType:
          $ref: "#/components/schemas/AssetType"
        loop:
          type: boolean
          default: true
          description: Whether animation playback and GIF export repeat indefinitely

    UpdateProjectRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        fps:
          type: number
          minimum: 1
          maximum: 60
        cellSize:
          type: integer
          minimum: 1
          maximum: 64
        assetType:
          $ref: "#/components/schemas/AssetType"
        loop:
          type: boolean
          description: Whether animation playback and GIF export repeat indefinitely

    OpenProjectRequest:
      type: object
      required: [path]
      properties:
        path:
          type: string
          minLength: 1
          description: Absolute or relative filesystem path to a .pixelanea bundle file

    SaveProjectRequest:
      type: object
      required: [path]
      properties:
        path:
          type: string
          minLength: 1
          description: Destination filesystem path for the .pixelanea bundle file
        assetType:
          $ref: "#/components/schemas/AssetType"

    SaveProjectResponse:
      type: object
      required: [path, savedAt]
      properties:
        path:
          type: string
          description: Resolved path where the bundle was written
        savedAt:
          type: string
          format: date-time
          description: UTC timestamp when the bundle was saved

    Project:
      type: object
      required: [id, name, width, height, frameCount, fps, cellSize, assetType, loop, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        width:
          type: integer
        height:
          type: integer
        frameCount:
          type: integer
        fps:
          type: number
        cellSize:
          type: integer
        assetType:
          $ref: "#/components/schemas/AssetType"
        loop:
          type: boolean
          description: Whether animation playback and GIF export repeat indefinitely
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    FrameMetadata:
      type: object
      required: [index, width, height, updatedAt]
      properties:
        index:
          type: integer
        width:
          type: integer
        height:
          type: integer
        updatedAt:
          type: string
          format: date-time

    Frame:
      allOf:
        - $ref: "#/components/schemas/FrameMetadata"
        - type: object
          required: [pixels]
          properties:
            pixels:
              type: array
              items:
                type: integer
                minimum: 0
                maximum: 255
              description: Palette indices row-major (width * height)

    PutFrameRequest:
      type: object
      required: [pixels]
      properties:
        pixels:
          type: array
          items:
            type: integer
            minimum: 0
            maximum: 255

    CellChange:
      type: object
      required: [x, y, previous, next]
      properties:
        x:
          type: integer
          minimum: 0
          description: Cell column (0-based)
        y:
          type: integer
          minimum: 0
          description: Cell row (0-based)
        previous:
          type: integer
          minimum: 0
          maximum: 255
          description: Expected palette index before the change (optimistic concurrency)
        next:
          type: integer
          minimum: 0
          maximum: 255
          description: Palette index after the change

    SelectionRect:
      type: object
      required: [x, y, width, height, shape]
      properties:
        x:
          type: integer
        y:
          type: integer
        width:
          type: integer
          minimum: 1
        height:
          type: integer
          minimum: 1
        shape:
          type: string
          enum: [rect, square, ellipse]

    SelectionClipboard:
      type: object
      required: [width, height, pixels]
      properties:
        width:
          type: integer
          minimum: 1
        height:
          type: integer
          minimum: 1
        pixels:
          type: array
          items:
            type: integer
            minimum: 0
            maximum: 255
        pixelsBase64:
          type: string
          description: Optional base64-encoded palette indices (width * height bytes)

    SelectionComputeRequest:
      type: object
      required: [gridWidth, gridHeight, operation]
      properties:
        gridWidth:
          type: integer
          minimum: 1
        gridHeight:
          type: integer
          minimum: 1
        pixels:
          type: array
          items:
            type: integer
            minimum: 0
            maximum: 255
          description: Palette indices row-major (width * height)
        pixelsBase64:
          type: string
          description: Base64-encoded palette indices (alternative to pixels array)
        selection:
          $ref: "#/components/schemas/SelectionRect"
        operation:
          type: string
          enum: [extract, clear_changes, paste_changes, move_changes]
        clipboard:
          $ref: "#/components/schemas/SelectionClipboard"
        origin:
          type: object
          required: [x, y]
          properties:
            x:
              type: integer
            y:
              type: integer
        delta:
          type: object
          required: [x, y]
          properties:
            x:
              type: integer
            y:
              type: integer

    SelectionComputeResponse:
      type: object
      properties:
        clipboard:
          $ref: "#/components/schemas/SelectionClipboard"
        changes:
          type: array
          items:
            $ref: "#/components/schemas/CellChange"

    DuplicateFramesRequest:
      type: object
      required: [frameCount]
      properties:
        frameCount:
          type: integer
          enum: [8, 16, 32]
        sourceFrameIndex:
          type: integer
          minimum: 0
          default: 0
          description: Frame to copy; defaults to frame 0
        fillMode:
          type: string
          enum: [copy, blank]
          default: copy
          description: copy duplicates source into all frames; blank keeps art only on source

    DuplicateFramesResponse:
      type: object
      required: [project, frames]
      properties:
        project:
          $ref: "#/components/schemas/Project"
        frames:
          type: array
          items:
            $ref: "#/components/schemas/FrameMetadata"

    CopyFrameRequest:
      type: object
      required: [sourceFrameIndex, targetFrameIndex]
      properties:
        sourceFrameIndex:
          type: integer
          minimum: 0
        targetFrameIndex:
          type: integer
          minimum: 0

    CopyFrameResponse:
      type: object
      required: [frame]
      properties:
        frame:
          $ref: "#/components/schemas/FrameMetadata"

    ReorderFramesRequest:
      type: object
      required: [fromIndex, toIndex]
      properties:
        fromIndex:
          type: integer
          minimum: 0
        toIndex:
          type: integer
          minimum: 0

    ReorderFramesResponse:
      type: object
      required: [frames]
      properties:
        frames:
          type: array
          items:
            $ref: "#/components/schemas/FrameMetadata"

    Color:
      type: object
      required: [slot, hex]
      properties:
        slot:
          type: integer
          minimum: 0
          maximum: 255
        hex:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
          example: "#FF0044"
        name:
          type: string

    Palette:
      type: object
      required: [id, name, colors]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        colors:
          type: array
          minItems: 1
          maxItems: 256
          items:
            $ref: "#/components/schemas/Color"

    PutPaletteRequest:
      type: object
      required: [colors]
      properties:
        name:
          type: string
          minLength: 1
        colors:
          type: array
          minItems: 1
          maxItems: 256
          items:
            $ref: "#/components/schemas/Color"

    ExportGifRequest:
      type: object
      properties:
        fps:
          type: number
          minimum: 1
          maximum: 60
          description: Animation speed; defaults to project fps
        loop:
          type: boolean
          description: Whether the GIF should loop indefinitely; defaults to the project loop setting

    PixelateImportRequest:
      type: object
      required: [imageData]
      properties:
        imageData:
          type: string
          format: byte
          description: Base64-encoded PNG, JPEG, or BMP image bytes
        targetWidth:
          type: integer
          minimum: 1
          maximum: 512
          description: Output grid width; defaults to project width
        targetHeight:
          type: integer
          minimum: 1
          maximum: 512
          description: Output grid height; defaults to project height
        maxColors:
          type: integer
          minimum: 2
          maximum: 256
          description: Extract a new palette with at most this many colors
        frameIndex:
          type: integer
          minimum: 0
          default: 0
          description: Frame slot to replace with pixelated result
        removeBackground:
          type: boolean
          default: true
          description: Remove detected background and output transparent pixels (index 0)

    PixelateImportResponse:
      type: object
      required: [frameIndex, width, height, pixels]
      properties:
        frameIndex:
          type: integer
        width:
          type: integer
        height:
          type: integer
        pixels:
          type: array
          items:
            type: integer
            minimum: 0
            maximum: 255
          description: Palette indices row-major (width * height)
        palette:
          $ref: "#/components/schemas/Palette"
