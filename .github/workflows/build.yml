name: Build

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute dependency hash
        id: deps-hash
        run: echo "hash=$(python3 scripts/deps-hash.py)" >> $GITHUB_OUTPUT

      - name: Compute asset hash
        id: assets-hash
        run: echo "hash=$(python3 scripts/assets-hash.py --build-type Debug)" >> $GITHUB_OUTPUT

      - name: Restore dependency cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/web/node_modules
            packages/api-client/node_modules
            server/build/_deps
            .cache/deps
          key: pixelanea-deps-${{ steps.deps-hash.outputs.hash }}

      - name: Restore asset cache
        uses: actions/cache@v4
        with:
          path: |
            apps/web/public
            packages/api-client/src/generated
            packages/api-client/dist
            apps/web/dist
            server/build/pixelanea-server
            server/build/pixelanea_tests
            .cache/assets
          key: pixelanea-assets-${{ steps.assets-hash.outputs.hash }}

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: ./scripts/deps-cache.sh install

      - name: Ensure API client assets
        run: ./scripts/assets-cache.sh ensure-api

      - name: Lint
        run: pnpm lint

      - name: Frontend unit tests
        run: pnpm --filter @pixelanea/web test

      - name: Build frontend
        run: ./scripts/assets-cache.sh ensure-web

      - name: Install backend build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ gcc curl python3

      - name: Build backend
        env:
          CMAKE_BUILD_TYPE: Debug
        run: ./scripts/assets-cache.sh ensure-server

      - name: Backend unit tests
        run: ctest --test-dir server/build --output-on-failure

      - name: Backend smoke tests
        run: ./scripts/test-backend.sh

      - name: Frontend smoke tests
        run: ./scripts/test-frontend.sh

  bump-version:
    needs: build
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') &&
      !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump version and push
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: ./scripts/ci-bump-and-push.sh "${{ github.ref_name }}"
