name: Build

on:
  push:
    branches: [develop, main, master]
  pull_request:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute dependency hash
        id: deps-hash
        run: echo "hash=$(python3 scripts/deps-hash.py)" >> $GITHUB_OUTPUT

      - name: Compute asset hash
        id: assets-hash
        run: echo "hash=$(python3 scripts/assets-hash.py --build-type Debug)" >> $GITHUB_OUTPUT

      - name: Install OS dependencies
        run: ./scripts/install-ci-os-deps.sh

      - name: Print toolchain versions
        run: |
          cmake --version
          g++ --version | head -1
          ninja --version
          git --version

      - name: Restore dependency cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/web/node_modules
            packages/api-client/node_modules
            server/build/_deps
            server/build/CMakeCache.txt
            .cache/deps
            .cache/venv-scripts
          key: pixelanea-deps-${{ steps.deps-hash.outputs.hash }}

      - name: Restore asset cache
        uses: actions/cache@v4
        with:
          path: |
            apps/web/public
            packages/api-client/src/generated
            packages/api-client/dist
            apps/web/dist
            server/build/pixelanea-server
            server/build/pixelanea_tests
            server/build/CTestTestfile.cmake
            server/build/DartConfiguration.tcl
            .cache/assets
          key: pixelanea-assets-${{ steps.assets-hash.outputs.hash }}

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify VERSION manifests
        run: ./scripts/ci-steps/00-verify-version.sh

      - name: Install dependencies
        run: ./scripts/ci-steps/01-deps.sh

      - name: Ensure API client assets
        run: ./scripts/ci-steps/02-api-assets.sh

      - name: Lint
        run: ./scripts/ci-steps/03-lint.sh

      - name: Frontend typecheck
        run: ./scripts/ci-steps/04-typecheck.sh

      - name: QA matrix harness
        run: ./scripts/ci-steps/05-test-qa.sh

      - name: Frontend unit tests
        run: ./scripts/ci-steps/06-test-unit.sh

      - name: Build frontend
        run: ./scripts/ci-steps/07-build-web.sh

      - name: Build backend — cmake configure
        env:
          CMAKE_BUILD_TYPE: Debug
          GIT_TERMINAL_PROMPT: 0
        run: ./scripts/ci-steps/08a-server-configure.sh

      - name: Build backend — compile
        env:
          CMAKE_BUILD_TYPE: Debug
        run: ./scripts/ci-steps/08b-server-compile.sh

      - name: Backend unit tests
        run: ./scripts/ci-steps/09-test-backend-unit.sh

      - name: Install Playwright browsers
        env:
          CI: true
        run: ./scripts/ci-steps/10-e2e-install.sh

      - name: Playwright E2E
        env:
          CI: true
        run: ./scripts/ci-steps/11-test-e2e.sh

      - name: Backend smoke tests
        run: ./scripts/ci-steps/12-smoke-backend.sh

      - name: Frontend smoke tests
        run: ./scripts/ci-steps/13-smoke-frontend.sh

  bump-version:
    needs: build
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/develop' ||
       github.ref == 'refs/heads/main' ||
       github.ref == 'refs/heads/master') &&
      !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump version and push
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: ./scripts/ci-bump-and-push.sh "${{ github.ref_name }}"
