name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  TAURI_CLI_VERSION: "2.0.0"

jobs:
  release-preflight:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify version manifests
        run: ./scripts/verify-version.sh

      - name: Export release version
        id: version
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> $GITHUB_OUTPUT

  release-linux:
    needs: release-preflight
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Compute dependency hash
        id: deps-hash
        run: echo "hash=$(python3 scripts/deps-hash.py)" >> $GITHUB_OUTPUT

      - name: Compute asset hash
        id: assets-hash
        run: echo "hash=$(python3 scripts/assets-hash.py --build-type Release)" >> $GITHUB_OUTPUT

      - name: Restore dependency cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/web/node_modules
            packages/api-client/node_modules
            server/build/_deps
            .cache/deps
          key: pixelanea-deps-${{ steps.deps-hash.outputs.hash }}

      - name: Restore asset cache
        uses: actions/cache@v4
        with:
          path: |
            apps/web/public
            packages/api-client/src/generated
            packages/api-client/dist
            apps/web/dist
            server/build/pixelanea-server
            .cache/assets
          key: pixelanea-assets-release-${{ steps.assets-hash.outputs.hash }}

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: ./scripts/deps-cache.sh install

      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev

      - name: Install desktop shell build dependencies
        run: ./scripts/install-desktop-shell-build-deps.sh

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "${{ env.TAURI_CLI_VERSION }}" --locked

      - name: Build .deb package
        run: ./scripts/package-deb.sh

      - name: Build portable tar.gz
        run: ./scripts/package-desktop-linux.sh

      - name: Smoke test .deb
        run: ./scripts/test-package-linux.sh --skip-build

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/pixelanea_*.deb
            dist/pixelanea-*-linux-*.tar.gz
          generate_release_notes: true

  release-windows:
    needs: release-preflight
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute dependency hash
        id: deps-hash
        shell: bash
        run: echo "hash=$(python3 scripts/deps-hash.py)" >> $GITHUB_OUTPUT

      - name: Compute asset hash
        id: assets-hash
        shell: bash
        run: echo "hash=$(python3 scripts/assets-hash.py --build-type Release)" >> $GITHUB_OUTPUT

      - name: Restore dependency cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/web/node_modules
            packages/api-client/node_modules
            server/build/_deps
            .cache/deps
          key: pixelanea-deps-${{ steps.deps-hash.outputs.hash }}

      - name: Restore asset cache
        uses: actions/cache@v4
        with:
          path: |
            apps/web/public
            packages/api-client/src/generated
            packages/api-client/dist
            apps/web/dist
            server/build
            .cache/assets
          key: pixelanea-assets-release-windows-${{ steps.assets-hash.outputs.hash }}

      - name: Restore vcpkg cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\vcpkg
          key: pixelanea-vcpkg-${{ hashFiles('server/vcpkg.json') }}

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "${{ env.TAURI_CLI_VERSION }}" --locked

      - name: Install dependencies
        shell: bash
        run: ./scripts/deps-cache.sh install

      - name: Setup MSVC dev environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build Windows packages
        env:
          VCPKG_ROOT: ${{ runner.temp }}\vcpkg
        run: .\scripts\package-windows.ps1

      - name: Smoke test Windows packages
        run: .\scripts\test-package-windows.ps1 -SkipBuild

      - name: Install smoke test Windows packages
        run: .\scripts\test-package-windows.ps1 -SkipBuild -InstallTest

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/pixelanea-*-windows-x64-setup.exe
            dist/pixelanea-*-windows-x64.zip

  release-macos:
    name: Release macOS (${{ matrix.mac_arch }})
    needs: release-preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            mac_arch: arm64
          - os: macos-15-intel
            mac_arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute dependency hash
        id: deps-hash
        run: echo "hash=$(python3 scripts/deps-hash.py)" >> $GITHUB_OUTPUT

      - name: Compute asset hash
        id: assets-hash
        run: echo "hash=$(python3 scripts/assets-hash.py --build-type Release)" >> $GITHUB_OUTPUT

      - name: Restore dependency cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/web/node_modules
            packages/api-client/node_modules
            server/build/_deps
            .cache/deps
          key: pixelanea-deps-${{ steps.deps-hash.outputs.hash }}

      - name: Restore asset cache
        uses: actions/cache@v4
        with:
          path: |
            apps/web/public
            packages/api-client/src/generated
            packages/api-client/dist
            apps/web/dist
            server/build
            .cache/assets
          key: pixelanea-assets-release-macos-${{ matrix.mac_arch }}-${{ steps.assets-hash.outputs.hash }}

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          key: macos-${{ matrix.mac_arch }}

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "${{ env.TAURI_CLI_VERSION }}" --locked

      - name: Install dependencies
        run: ./scripts/deps-cache.sh install

      - name: Verify host architecture
        run: |
          HOST_ARCH="$(uname -m)"
          case "${HOST_ARCH}" in
            arm64|aarch64) EXPECTED="arm64" ;;
            x86_64) EXPECTED="x64" ;;
            *) echo "Unsupported host arch: ${HOST_ARCH}" >&2; exit 1 ;;
          esac
          if [[ "${EXPECTED}" != "${{ matrix.mac_arch }}" ]]; then
            echo "Runner arch ${EXPECTED} does not match matrix ${{ matrix.mac_arch }}" >&2
            exit 1
          fi

      - name: Build macOS packages
        run: ./scripts/package-dmg.sh

      - name: Smoke test macOS packages
        run: ./scripts/test-package-macos.sh --skip-build --install-test

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/pixelanea-*-macos-${{ matrix.mac_arch }}.dmg
            dist/pixelanea-*-macos-${{ matrix.mac_arch }}.zip

  release-linux-arm64:
    name: Build arm64 .deb (verify only)
    needs: release-preflight
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Compute dependency hash
        id: deps-hash
        run: echo "hash=$(python3 scripts/deps-hash.py)" >> $GITHUB_OUTPUT

      - name: Compute asset hash
        id: assets-hash
        run: echo "hash=$(python3 scripts/assets-hash.py --build-type Release)" >> $GITHUB_OUTPUT

      - name: Restore dependency cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/web/node_modules
            packages/api-client/node_modules
            server/build/_deps
            .cache/deps
          key: pixelanea-deps-${{ steps.deps-hash.outputs.hash }}

      - name: Restore asset cache
        uses: actions/cache@v4
        with:
          path: |
            apps/web/public
            packages/api-client/src/generated
            packages/api-client/dist
            apps/web/dist
            server/build/pixelanea-server
            .cache/assets
          key: pixelanea-assets-release-${{ steps.assets-hash.outputs.hash }}

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: ./scripts/deps-cache.sh install

      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev

      - name: Install desktop shell build dependencies
        run: ./scripts/install-desktop-shell-build-deps.sh

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "${{ env.TAURI_CLI_VERSION }}" --locked

      - name: Build arm64 .deb package
        run: ./scripts/package-deb.sh

      - name: Smoke test arm64 .deb
        run: ./scripts/test-package-linux.sh --skip-build
