name: Backend CI

on:
  push:
    paths:
      - "server/**"
      - "contracts/**"
      - "scripts/test-backend.sh"
      - "scripts/dev.sh"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "server/**"
      - "contracts/**"
      - "scripts/test-backend.sh"
      - "scripts/dev.sh"
      - ".github/workflows/backend.yml"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ gcc curl python3

      - name: Configure
        run: |
          cmake -S server -B server/build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER=g++ \
            -DCMAKE_C_COMPILER=gcc \
            -G "Unix Makefiles"

      - name: Build
        run: cmake --build server/build

      - name: Unit tests (ctest)
        run: ctest --test-dir server/build --output-on-failure

      - name: Smoke tests
        run: ./scripts/test-backend.sh
