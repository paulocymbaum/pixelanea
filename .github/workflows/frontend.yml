name: Frontend CI

on:
  push:
    paths:
      - "apps/web/**"
      - "packages/api-client/**"
      - "contracts/openapi.yaml"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - "scripts/test-frontend.sh"
      - "scripts/dev.sh"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "apps/web/**"
      - "packages/api-client/**"
      - "contracts/openapi.yaml"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - "scripts/test-frontend.sh"
      - "scripts/dev.sh"
      - ".github/workflows/frontend.yml"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Generate API client
        run: pnpm generate:api

      - name: Lint
        run: pnpm lint

      - name: Unit tests (vitest)
        run: pnpm --filter @pixelanea/web test

      - name: Build
        run: pnpm build

      - name: Install backend build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ gcc curl python3

      - name: Build backend for smoke tests
        run: |
          cmake -S server -B server/build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER=g++ \
            -DCMAKE_C_COMPILER=gcc \
            -G "Unix Makefiles"
          cmake --build server/build

      - name: Smoke tests
        run: ./scripts/test-frontend.sh
